[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certin-sentinel"
version = "0.1.0"
description = "CERT-In Sentinel — Sovereign Cyber Incident Triage, MITRE ATT&CK Mapping, and 6-Hour CERT-In / DPDP Compliance Reporting Engine for India."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "GrooveXlabs", email = "security@groovexlabs.com" },
]
keywords = [
    "cert-in", "incident-response", "mitre-attack", "dpdp", "cybersecurity",
    "compliance", "soc", "india", "sovereign", "grooveguard"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
sentinel = "certin_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/certin-sentinel"
Repository = "https://github.com/GrooveXlabs/certin-sentinel"
Issues = "https://github.com/GrooveXlabs/certin-sentinel/issues"
